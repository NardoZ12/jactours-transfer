server {
    listen 3000;
    server_name _;
    root /app;
    index traslados.html;

    # Favicon
    location = /favicon.ico {
        try_files /01-website-mirror/site/assets/favicon-jac.png =404;
    }

    # Robots.txt (Vercel serves public/ at root)
    location = /robots.txt {
        try_files /public/robots.txt =404;
    }

    # Assets — /assets/ maps to 01-website-mirror/site/assets/
    location /assets/ {
        try_files /01-website-mirror/site$uri =404;
    }

    # Panel web — /panelweb/ maps to 02-sistema-reservas/panelweb/
    location /panelweb/ {
        try_files /02-sistema-reservas$uri /02-sistema-reservas$uri.html =404;
    }

    # Servicios — root-level servicios/ directory with .html extension support
    location /servicios/ {
        try_files $uri $uri.html =404;
    }

    # English pages — /en/ maps to 01-website-mirror/site/en/
    location /en/ {
        try_files /01-website-mirror/site$uri /01-website-mirror/site$uri.html =404;
    }

    # Traslados shortcuts
    location = /traslados { try_files /01-website-mirror/site/traslados.html =404; }
    location = /traslados/ { try_files /01-website-mirror/site/traslados.html =404; }
    location = /traslados.html { try_files /01-website-mirror/site/traslados.html =404; }

    # Root — serves the transfer booking page
    location = / {
        try_files /01-website-mirror/site/traslados.html =404;
    }

    # Catch-all — try the file itself, then site/ with .html extension
    location / {
        try_files $uri /01-website-mirror/site$uri.html /01-website-mirror/site$uri =404;
    }
}
