<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario Operativo | Jac Tours & Transfer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
<style id="jac-brand-overrides">
:root {
  --jac-accent: #f4efec;
  --jac-body: #ddb7ab;
  --jac-strong: #999b85;
}
h1,h2,h3,h4,h5,h6 { color: var(--jac-strong) !important; }
p, li { color: var(--jac-body) !important; }
a[role="button"], button, .quick-access a {
  background: var(--jac-accent) !important;
  color: #1f2a30 !important;
  border: 1px solid rgba(31,42,48,0.18) !important;
}
.quick-access {
  top: 86px !important;
  right: 22px !important;
  gap: 8px !important;
  z-index: 9999 !important;
}
.quick-access a {
  border-radius: 999px !important;
  font-weight: 700 !important;
  padding: 8px 14px !important;
}
@media (max-width: 900px) {
  .quick-access {
    top: 72px !important;
    right: 12px !important;
    flex-direction: row !important;
  }
}
</style>
</head>
<body>
  <main class="wrap">
    <section class="card" style="padding: 18px;">
      <h1>Calendario Operativo</h1>
      <p class="muted">Manifiesto diario con pickup, contacto y asignacion de recursos.</p>
      <form id="manifestForm" class="form-grid compact" style="margin-top: 14px;">
        <label>
          Fecha
          <input id="manifestDate" type="date" required />
        </label>
        <button type="submit">Ver manifiesto</button>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Hora</th>
              <th>Codigo</th>
              <th>Cliente</th>
              <th>Pickup</th>
              <th>Contacto</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="manifestBody"></tbody>
        </table>
      </div>
      <p id="manifestMsg" class="msg"></p>
      <p><a href="./index.html">Volver al dashboard</a></p>
    </section>
  </main>
  <script type="module" src="./modules.js"></script>
</body>
</html>
