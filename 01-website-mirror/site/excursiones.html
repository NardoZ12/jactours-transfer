<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excursiones en Punta Cana | JAC Tours & Transfer</title>
  <meta name="description" content="Reserva tus excursiones en Punta Cana: Isla Saona, Isla Catalina, Buggies, ATV, Santo Domingo y más. Por persona o por tipo de máquina." />
  <link rel="icon" href="./assets/favicon-jac.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/booking-widget.css" />
  <style>
    @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f5f5f5 0%, #ffffff 100%);
      min-height: 100vh;
      color: #2c2c2c;
      font-size: 14px;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

    header {
      text-align: center;
      margin-bottom: 30px;
      animation: slideDown 0.6s ease;
      background: linear-gradient(135deg, #161e34 0%, #0d1520 100%);
      padding: 24px 20px;
      margin: -40px -20px 30px;
    }
    .header-logo { height: 35px; width: auto; filter: brightness(1.1); margin-bottom: 12px; }
    header h1 { font-size: 32px; font-weight: 800; color: white; margin-bottom: 6px; letter-spacing: -0.5px; }
    header p { font-size: 12px; color: rgba(255,255,255,0.8); font-weight: 300; }

    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; animation: fadeIn 0.8s ease; }
    .filter-btn {
      padding: 8px 18px; border: 2px solid #e0e0e0; border-radius: 20px; background: white;
      font-size: 13px; font-weight: 600; color: #555; cursor: pointer; transition: all 0.3s ease; font-family: inherit;
    }
    .filter-btn:hover { border-color: #f27d2e; color: #f27d2e; }
    .filter-btn.active { border-color: #f27d2e; background: linear-gradient(135deg, #f27d2e 0%, #d96b25 100%); color: white; }

    .excursion-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;
      margin-bottom: 30px; animation: fadeIn 0.8s ease;
    }

    .excursion-card {
      background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      transition: all 0.3s ease; display: flex; flex-direction: column; cursor: pointer;
    }
    .excursion-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.12); }
    .excursion-card.selected { border: 2px solid #f27d2e; box-shadow: 0 16px 40px rgba(242,125,46,0.2); }

    .card-img {
      height: 140px; background: linear-gradient(135deg, #161e34 0%, #0d1520 100%);
      display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
    }
    .card-img .emoji { font-size: 48px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3)); }
    .card-badge {
      position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 6px;
      font-size: 11px; font-weight: 700; color: white; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-excur { background: #53d2dc; }
    .badge-aventura { background: #f27d2e; }
    .badge-show { background: #a855f7; }

    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .card-body h3 { font-size: 16px; font-weight: 700; color: #2c2c2c; margin-bottom: 6px; }
    .card-body p { font-size: 12px; color: #888; line-height: 1.5; margin-bottom: 12px; flex: 1; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; }
    .card-price { font-size: 20px; font-weight: 800; color: #f27d2e; }
    .card-price small { font-size: 12px; font-weight: 500; color: #999; }
    .card-btn {
      padding: 8px 16px; background: linear-gradient(135deg, #f27d2e 0%, #d96b25 100%); color: white;
      border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer;
      transition: all 0.3s ease; font-family: inherit; box-shadow: 0 4px 12px rgba(242,125,46,0.25);
    }
    .card-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(242,125,46,0.35); }

    /* Booking panel */
    .booking-panel {
      background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      overflow: hidden; margin-bottom: 20px; animation: scaleIn 0.4s ease; display: none;
    }
    .booking-panel.active { display: block; }

    .booking-head {
      padding: 18px 24px; background: linear-gradient(135deg, #161e34 0%, #0d1520 100%); color: white;
      display: flex; align-items: center; justify-content: space-between;
    }
    .booking-head h2 { font-size: 18px; font-weight: 700; }
    .booking-head .close-btn {
      background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 0; line-height: 1;
    }
    .booking-body { padding: 24px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid.full { grid-template-columns: 1fr; }
    .form-group { margin-bottom: 0; }
    .form-group.full { grid-column: 1 / -1; }
    label { display: block; font-size: 11px; font-weight: 600; color: #555; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select {
      width: 100%; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: 8px;
      font-size: 13px; font-family: inherit; font-weight: 500; background: #fafafa; transition: all 0.3s ease;
    }
    input:focus, select:focus { outline: none; background: white; border-color: #f27d2e; box-shadow: 0 0 0 4px rgba(242,125,46,0.08); }

    .machine-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 8px; }
    .machine-card {
      padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; background: white; cursor: pointer;
      transition: all 0.3s ease; text-align: left; position: relative; overflow: hidden; font-family: inherit;
    }
    .machine-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, #f27d2e 0%, transparent 100%); transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease;
    }
    .machine-card:hover { border-color: #f27d2e; box-shadow: 0 8px 20px rgba(242,125,46,0.15); transform: translateY(-2px); }
    .machine-card:hover::before { transform: scaleX(1); }
    .machine-card.selected { border-color: #f27d2e; background: linear-gradient(135deg, rgba(242,125,46,0.05) 0%, rgba(242,125,46,0.02) 100%); box-shadow: 0 8px 25px rgba(242,125,46,0.2); }
    .machine-card.selected::before { transform: scaleX(1); }
    .machine-card h4 { font-size: 14px; font-weight: 700; color: #2c2c2c; margin-bottom: 4px; }
    .machine-price { font-size: 18px; font-weight: 800; color: #f27d2e; margin-bottom: 2px; }
    .machine-card small { font-size: 11px; color: #999; }

    .summary-box {
      background: linear-gradient(135deg, #f9f7f5 0%, #fafafa 100%); border: 1px solid #e0e0e0;
      border-left: 4px solid #f27d2e; padding: 16px; border-radius: 10px; margin-top: 20px;
    }
    .summary-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; font-weight: 500; color: #555; }
    .summary-item:last-child { margin-bottom: 0; border-top: 2px solid #e0e0e0; padding-top: 12px; font-weight: 700; font-size: 16px; color: #2c2c2c; }

    .btn-checkout {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #f27d2e 0%, #d96b25 100%); color: white;
      border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer;
      transition: all 0.3s ease; margin-top: 16px; box-shadow: 0 4px 15px rgba(242,125,46,0.25);
      text-transform: uppercase; letter-spacing: 0.5px; font-family: inherit;
    }
    .btn-checkout:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(242,125,46,0.35); }
    .btn-checkout:disabled { opacity: 0.5; cursor: not-allowed; }

    .whatsapp-btn {
      position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; background: #25D366;
      border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white;
      box-shadow: 0 4px 12px rgba(37,211,102,0.4); text-decoration: none; transition: all 0.3s ease; z-index: 999;
    }
    .whatsapp-btn:hover { transform: scale(1.1); }
    .whatsapp-btn svg { width: 24px; height: 24px; }

    @media (max-width: 640px) {
      body { padding: 20px 16px; }
      header h1 { font-size: 26px; }
      .excursion-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .machine-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="./assets/logo-3.png" alt="JAC Tours" class="header-logo" />
      <h1>Excursiones en Punta Cana</h1>
      <p>Tours · Aventura · Shows · Reserva directa online</p>
    </header>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">Todas</button>
      <button class="filter-btn" data-filter="excursion">Excursiones</button>
      <button class="filter-btn" data-filter="aventura">Aventura</button>
      <button class="filter-btn" data-filter="show">Shows</button>
    </div>

    <div class="excursion-grid" id="excursionGrid"></div>

    <div class="booking-panel" id="bookingPanel">
      <div class="booking-head">
        <h2 id="bookingTitle">Reserva tu excursión</h2>
        <button class="close-btn" id="closeBooking">&times;</button>
      </div>
      <div class="booking-body" id="bookingBody"></div>
    </div>
  </div>

  </a>

  <script src="./assets/excursiones-booking.js"></script>
</body>
</html>
