<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estado de Reserva | Jac Tours & Transfer</title>
  <meta name="description" content="Consulta en tiempo real el estado de tu reserva, pagos y detalles de servicio." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/reservas.css" />
<style id="jac-brand-overrides">
:root {
  --jac-accent: #f4efec;
  --jac-body: #ddb7ab;
  --jac-strong: #999b85;
}
h1,h2,h3,h4,h5,h6 { color: var(--jac-strong) !important; }
p, li { color: var(--jac-body) !important; }
a[role="button"], button, .quick-access a {
  background: var(--jac-accent) !important;
  color: #1f2a30 !important;
  border: 1px solid rgba(31,42,48,0.18) !important;
}
.quick-access {
  top: 86px !important;
  right: 22px !important;
  gap: 8px !important;
  z-index: 9999 !important;
}
.quick-access a {
  border-radius: 999px !important;
  font-weight: 700 !important;
  padding: 8px 14px !important;
}
@media (max-width: 900px) {
  .quick-access {
    top: 72px !important;
    right: 12px !important;
    flex-direction: row !important;
  }
}
</style>
<script id="jac-logo-lock">
(function () {
  var MAIN = "/assets/logo-4.png";
  var SECONDARY = "/assets/logo-2.png";

  function setLogo(img, src) {
    if (!img) return;
    var target = src + "?v=jac";
    if (!img.src.includes(src)) img.src = target;
    if (img.srcset) img.srcset = "";
  }

  function applyLogos(root) {
    var scope = root || document;

    // Header/main logo containers in Framer output
    scope.querySelectorAll('[data-framer-name="Logo"] img').forEach(function (img) {
      setLogo(img, MAIN);
    });

    // Secondary repeated logo blocks used in footer/title groups
    scope.querySelectorAll('[data-framer-name="Title"] img').forEach(function (img) {
      setLogo(img, SECONDARY);
    });

    // Fallback by known legacy image IDs if Framer injects them dynamically
    scope.querySelectorAll('img[src*="eAPmeOxTlCvyzuBkqgyST4UEsVQ11da"], img[src*="UvWLe43Ct2rVlnhEIo18X37ruM278b"]').forEach(function (img) {
      var inLogo = img.closest('[data-framer-name="Logo"]');
      setLogo(img, inLogo ? MAIN : SECONDARY);
    });
  }

  function initLogoLock() {
    applyLogos(document);

    var observer = new MutationObserver(function (mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var m = mutations[i];
        if (m.type === "childList") {
          m.addedNodes.forEach(function (node) {
            if (node.nodeType === 1) applyLogos(node);
          });
        } else if (m.type === "attributes" && m.target.tagName === "IMG") {
          applyLogos(m.target.closest('[data-framer-name]') || document);
        }
      }
    });

    observer.observe(document.documentElement, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ["src", "srcset"]
    });

    // Extra safety for late async re-renders
    setTimeout(function(){ applyLogos(document); }, 500);
    setTimeout(function(){ applyLogos(document); }, 1500);
    setTimeout(function(){ applyLogos(document); }, 3000);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initLogoLock);
  } else {
    initLogoLock();
  }
})();
</script>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Estado de tu Reserva</h1>
      <p class="muted">Consulta por codigo de reserva y correo.</p>
      <form id="statusForm" class="grid">
        <label>
          Codigo de reserva
          <input id="queryCode" required placeholder="DB-YYMMDD-XXXXXX" />
        </label>
        <label>
          Correo
          <input id="queryEmail" type="email" required />
        </label>
        <button type="submit" style="grid-column: 1 / -1;">Consultar</button>
      </form>
      <p id="statusMsg" class="msg"></p>
    </section>

    <section id="statusContainer" class="card" hidden style="margin-top: 14px;">
      <h2>Detalle</h2>
      <div class="grid-3" style="margin-top: 12px;">
        <div><strong>Codigo:</strong> <span id="rCode">-</span></div>
        <div><strong>Cliente:</strong> <span id="rName">-</span></div>
        <div><strong>Fecha:</strong> <span id="rDate">-</span></div>
        <div><strong>Estado:</strong> <span class="badge" id="rStatus">-</span></div>
        <div><strong>Pago:</strong> <span class="badge" id="rPayStatus">-</span></div>
        <div><strong>Total:</strong> <span id="rTotal">-</span></div>
        <div><strong>Pagado:</strong> <span id="rPaid">-</span></div>
        <div><strong>Pendiente:</strong> <span id="rDue">-</span></div>
      </div>

      <div class="table-wrap">
        <h3>Extras</h3>
        <table>
          <thead>
            <tr><th>Extra</th><th>Cant.</th><th>Total</th></tr>
          </thead>
          <tbody id="extrasBody"></tbody>
        </table>
      </div>

      <div class="table-wrap">
        <h3>Pagos</h3>
        <table>
          <thead>
            <tr><th>Fecha</th><th>Estado</th><th>Monto</th></tr>
          </thead>
          <tbody id="paymentsBody"></tbody>
        </table>
      </div>

      <p style="margin-top: 12px;"><a id="manageLink" href="cancelar-reprogramar.html">Cancelar/Reprogramar</a></p>
    </section>
  </main>
  <script type="module" src="assets/reservas.js"></script>
</body>
</html>
