<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicitar Traslado | JAC Tours & Transfer</title>
  <meta name="description" content="Solicita tu traslado privado en Puntacana. Elige origen, destino y vehículo en segundos." />
  <link rel="icon" href="../assets/favicon-jac.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #f27d2e;
      --brand-dark: #d96b25;
      --dark: #1a1a1a;
      --panel-bg: #ffffff;
      --surface: #f7f7f7;
      --border: #e8e8e8;
      --text: #1a1a1a;
      --muted: #757575;
      --success: #27ae60;
      --panel-w: 400px;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--dark);
      color: var(--text);
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    #map { flex: 1; z-index: 0; }

    .panel {
      width: var(--panel-w);
      min-width: var(--panel-w);
      max-width: var(--panel-w);
      height: 100vh;
      background: var(--panel-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
      box-shadow: -4px 0 24px rgba(0,0,0,.18);
    }

    .brand {
      background: var(--dark);
      padding: 18px 24px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: var(--brand);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .brand-text h1 { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.2px; }
    .brand-text p  { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 1px; }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-track { background: transparent; }
    .panel-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

    .section { padding: 20px 24px 0; }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .route-block {
      background: var(--surface);
      border-radius: 12px;
      overflow: visible;
      border: 1px solid var(--border);
    }

    .route-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      position: relative;
    }

    .route-row + .route-row { border-top: 1px solid var(--border); }

    .route-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .route-dot.origin { background: var(--success); }
    .route-dot.dest   { background: var(--dark); }

    .route-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      color: var(--text);
      outline: none;
      min-width: 0;
    }

    .route-input::placeholder { color: #aaa; font-weight: 400; }
    .route-input:focus { color: var(--brand); }

    .btn-myloc {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s;
    }

    .btn-myloc:hover:not(:disabled) { background: var(--brand-dark); }
    .btn-myloc:disabled { opacity: .5; cursor: default; }

    .route-connector {
      width: 2px;
      height: 16px;
      background: linear-gradient(to bottom, var(--success), var(--dark));
      margin-left: 17px;
    }

    .form-group { position: relative; flex: 1; }

    .autocomplete-suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: -14px;
      right: -14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }

    .autocomplete-suggestions li {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      color: var(--text);
      transition: background .15s;
    }

    .autocomplete-suggestions li:last-child { border-bottom: none; }
    .autocomplete-suggestions li:hover { background: #f9f9f9; color: var(--brand); }

    .autocomplete-suggestions li.no-results {
      color: var(--muted);
      cursor: default;
      text-align: center;
      font-style: italic;
    }

    .map-toggle { display: flex; gap: 8px; margin-top: 10px; }

    .map-toggle-btn {
      flex: 1;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      transition: all .2s;
    }

    .map-toggle-btn.active { border-color: var(--brand); color: var(--brand); background: rgba(242,125,46,.06); }

    .stepper {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      width: fit-content;
    }

    .stepper-btn {
      width: 40px;
      height: 40px;
      background: var(--surface);
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--text);
      transition: background .15s;
      font-weight: 600;
    }

    .stepper-btn:hover { background: #eee; }

    .stepper-val {
      width: 52px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 0;
      height: 40px;
      -moz-appearance: textfield;
    }

    .stepper-val::-webkit-outer-spin-button,
    .stepper-val::-webkit-inner-spin-button { -webkit-appearance: none; }

    .distance-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .distance-badge.has-value { color: var(--brand); border-color: var(--brand); background: rgba(242,125,46,.06); }

    .vehicle-list { display: flex; flex-direction: column; gap: 10px; }

    .vehicle-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      transition: all .2s;
      position: relative;
      width: 100%;
      text-align: left;
    }

    .vehicle-card:hover { border-color: var(--brand); box-shadow: 0 4px 16px rgba(242,125,46,.12); }

    .vehicle-card.selected {
      border-color: var(--brand);
      background: rgba(242,125,46,.04);
      box-shadow: 0 4px 16px rgba(242,125,46,.18);
    }

    .vehicle-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .vehicle-card.selected .vehicle-icon { background: rgba(242,125,46,.1); }

    .vehicle-info { flex: 1; min-width: 0; }
    .vehicle-info h4 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .vehicle-info small { font-size: 11px; color: var(--muted); }

    .vehicle-price { font-size: 16px; font-weight: 800; color: var(--brand); flex-shrink: 0; }

    .vehicle-selected-check {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      font-size: 10px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .vehicle-card.selected .vehicle-selected-check { display: flex; }

    .no-vehicles { text-align: center; padding: 24px; color: var(--muted); font-size: 13px; }

    .summary {
      background: var(--dark);
      border-radius: 12px;
      padding: 16px;
      color: #fff;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding: 5px 0;
      color: rgba(255,255,255,.7);
    }

    .summary-row.total {
      border-top: 1px solid rgba(255,255,255,.12);
      margin-top: 8px;
      padding-top: 12px;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }

    .summary-row.total span:last-child { color: var(--brand); }

    .panel-footer {
      padding: 16px 24px 24px;
      flex-shrink: 0;
      background: #fff;
      border-top: 1px solid var(--border);
    }

    .btn-cta {
      width: 100%;
      padding: 16px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: .2px;
      cursor: pointer;
      transition: all .2s;
      box-shadow: 0 4px 20px rgba(242,125,46,.35);
    }

    .btn-cta:hover:not(:disabled) {
      background: var(--brand-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(242,125,46,.45);
    }

    .btn-cta:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

    .map-tip {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26,26,26,.88);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
      transition: opacity .3s;
    }

    .spacer { height: 16px; }

    @media (max-width: 768px) {
      html, body { overflow: auto; height: auto; }

      .app { flex-direction: column; height: auto; min-height: 100vh; }

      #map { flex: none; height: 52vh; min-height: 280px; width: 100%; }

      .panel {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        height: auto;
        min-height: auto;
        overflow: visible;
        box-shadow: 0 -8px 30px rgba(0,0,0,.15);
      }

      .panel-body { overflow: visible; }
    }
  </style>
</head>
<body>
  <div class="app">

    <div style="position:relative; flex:1;">
      <div id="map"></div>
      <div class="map-tip" id="mapTip">📍 Toca el mapa para fijar SALIDA</div>
    </div>

    <aside class="panel">

      <div class="brand">
        <div class="brand-logo">🚐</div>
        <div class="brand-text">
          <h1>JAC Tours &amp; Transfer</h1>
          <p>Puntacana · Traslados privados</p>
        </div>
      </div>

      <div class="panel-body">

        <div class="section" style="padding-top:20px;">
          <div class="section-label">Tu trayecto</div>

          <div class="route-block">
            <div class="route-row">
              <div class="route-dot origin"></div>
              <div class="form-group">
                <input class="route-input" type="text" id="pickupInput" placeholder="¿Desde dónde sales?" autocomplete="off" />
              </div>
              <button type="button" id="getCurrentLocationBtn" class="btn-myloc" title="Mi ubicación">📍</button>
            </div>

            <div class="route-connector"></div>

            <div class="route-row">
              <div class="route-dot dest"></div>
              <div class="form-group">
                <input class="route-input" type="text" id="destinationInput" placeholder="¿A dónde vas?" autocomplete="off" />
              </div>
            </div>
          </div>

          <div class="map-toggle">
            <button type="button" class="map-toggle-btn active" id="mapBtnPickup" onclick="setMapMode('pickup')">
              📍 Fijar salida
            </button>
            <button type="button" class="map-toggle-btn" id="mapBtnDest" onclick="setMapMode('destination')">
              🏁 Fijar destino
            </button>
          </div>
        </div>

        <div class="spacer"></div>

        <div class="section">
          <div class="section-label">Pasajeros</div>
          <div style="display:flex; align-items:center; justify-content:space-between; gap:16px;">
            <div class="stepper">
              <button type="button" class="stepper-btn" id="btnMinus">−</button>
              <input class="stepper-val" type="number" id="passengers" min="1" max="49" value="1" />
              <button type="button" class="stepper-btn" id="btnPlus">+</button>
            </div>
            <div class="distance-badge" id="distanceBadge">
              <span>📏</span>
              <span id="distanceLabel">— km</span>
            </div>
            <input type="number" id="distance" min="0" step="0.1" style="display:none;" />
          </div>
        </div>

        <div class="spacer"></div>

        <div class="section">
          <div class="section-label">Elige tu vehículo</div>
          <div id="vehicleOptions" class="vehicle-list"></div>
          <input type="hidden" id="selectedVehicle" />
          <input type="hidden" id="transportPrice" />
        </div>

        <div class="spacer"></div>

        <div class="section" style="padding-bottom:20px;">
          <div class="section-label">Resumen</div>
          <div class="summary">
            <div class="summary-row">
              <span>Vehículo</span>
              <span id="summaryVehicle">—</span>
            </div>
            <div class="summary-row">
              <span>Distancia</span>
              <span id="summaryDistance">—</span>
            </div>
            <div class="summary-row">
              <span>Pasajeros</span>
              <span id="summaryPassengers">—</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span id="summaryPrice">$0.00</span>
            </div>
          </div>
        </div>

      </div>

      <div class="panel-footer">
        <button id="checkoutBtn" class="btn-cta" disabled>
          Solicitar traslado →
        </button>
      </div>

    </aside>
  </div>

  <input type="hidden" id="gpsCoordinates" />
  <select id="mapMode" style="display:none;">
    <option value="pickup">pickup</option>
    <option value="destination">destination</option>
  </select>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="../assets/traslados-calculator-leaflet.js"></script>

  <script>
    function setMapMode(mode) {
      const sel = document.getElementById('mapMode');
      if (sel) sel.value = mode;
      const tip = document.getElementById('mapTip');
      const btnP = document.getElementById('mapBtnPickup');
      const btnD = document.getElementById('mapBtnDest');
      if (mode === 'pickup') {
        btnP.classList.add('active');
        btnD.classList.remove('active');
        if (tip) tip.textContent = '📍 Toca el mapa para fijar SALIDA';
      } else {
        btnD.classList.add('active');
        btnP.classList.remove('active');
        if (tip) tip.textContent = '🏁 Toca el mapa para fijar DESTINO';
      }
    }

    document.getElementById('btnPlus').addEventListener('click', () => {
      const el = document.getElementById('passengers');
      el.value = Math.min(49, (parseInt(el.value) || 1) + 1);
      el.dispatchEvent(new Event('change'));
    });

    document.getElementById('btnMinus').addEventListener('click', () => {
      const el = document.getElementById('passengers');
      el.value = Math.max(1, (parseInt(el.value) || 1) - 1);
      el.dispatchEvent(new Event('change'));
    });

    function patchVehicleRenderer() {
      if (!window.trasladosCalc) return;
      const icons = { starex: '🚙', hiace: '🚐', coaster: '🚌', universe: '🚍' };
      window.trasladosCalc.updatePriceDisplay = function () {
        const container = document.getElementById('vehicleOptions');
        if (!container) return;
        container.innerHTML = '';

        const prices = this.prices;
        const FREE_KM = 15;

        if (Object.keys(prices).length === 0) {
          const msg = document.createElement('p');
          msg.className = 'no-vehicles';
          msg.textContent = `No hay vehículos disponibles para ${this.passengers} pasajeros`;
          container.appendChild(msg);
          return;
        }

        const VEHICLES_REF = (typeof VEHICLES !== 'undefined') ? VEHICLES : {};

        Object.entries(prices).forEach(([key, price]) => {
          const v = VEHICLES_REF[key] || { name: key };
          const isSelected = this.selectedVehicle === key;
          const icon = icons[key] || '🚗';
          const distKm = this.distance || 0;
          const hint = distKm <= FREE_KM
            ? `Tarifa fija hasta ${FREE_KM} km`
            : `${FREE_KM} km incl. + $${(v.extraKmPrice || 0).toFixed(2)}/km extra`;

          const card = document.createElement('button');
          card.className = `vehicle-card${isSelected ? ' selected' : ''}`;
          card.setAttribute('data-vehicle', key);

          const iconEl = document.createElement('div');
          iconEl.className = 'vehicle-icon';
          iconEl.textContent = icon;

          const infoEl = document.createElement('div');
          infoEl.className = 'vehicle-info';
          const nameEl = document.createElement('h4');
          nameEl.textContent = v.name;
          const hintEl = document.createElement('small');
          hintEl.textContent = hint;
          infoEl.appendChild(nameEl);
          infoEl.appendChild(hintEl);

          const priceEl = document.createElement('div');
          priceEl.className = 'vehicle-price';
          priceEl.textContent = '$' + price.toFixed(2);

          const checkEl = document.createElement('div');
          checkEl.className = 'vehicle-selected-check';
          checkEl.textContent = '✓';

          card.appendChild(iconEl);
          card.appendChild(infoEl);
          card.appendChild(priceEl);
          card.appendChild(checkEl);

          card.addEventListener('click', (e) => {
            e.preventDefault();
            this.selectVehicle(key);
          });
          container.appendChild(card);
        });
      };
    }

    function updateUI() {
      const calc = window.trasladosCalc;
      if (!calc) return;

      const data = calc.getSelectedData();

      const badge = document.getElementById('distanceBadge');
      const label = document.getElementById('distanceLabel');
      if (data.distance) {
        label.textContent = data.distance.toFixed(1) + ' km';
        badge.classList.add('has-value');
      } else {
        label.textContent = '— km';
        badge.classList.remove('has-value');
      }

      document.getElementById('summaryVehicle').textContent = data.vehicleName || '—';
      document.getElementById('summaryDistance').textContent = data.distance ? data.distance.toFixed(1) + ' km' : '—';
      document.getElementById('summaryPassengers').textContent = data.passengers
        ? data.passengers + (data.passengers === 1 ? ' persona' : ' personas')
        : '—';
      document.getElementById('summaryPrice').textContent = '$' + (data.price || 0).toFixed(2);

      const ready = data.vehicle && data.pickup && data.destination;
      document.getElementById('checkoutBtn').disabled = !ready;
    }

    setInterval(updateUI, 300);

    const waitForCalc = setInterval(() => {
      if (window.trasladosCalc) {
        clearInterval(waitForCalc);
        patchVehicleRenderer();
        window.trasladosCalc.calculatePrices();
      }
    }, 100);

    let tipHidden = false;
    document.getElementById('map').addEventListener('click', () => {
      if (!tipHidden) {
        setTimeout(() => {
          const tip = document.getElementById('mapTip');
          if (tip) tip.style.opacity = '0';
          tipHidden = true;
        }, 1500);
      }
    });

    document.getElementById('checkoutBtn').addEventListener('click', () => {
      const calc = window.trasladosCalc;
      if (!calc) { alert('Calculador no inicializado'); return; }

      const data = calc.getSelectedData();
      if (!data.vehicle || !data.pickup || !data.destination) {
        alert('Por favor completa: origen, destino y vehículo');
        return;
      }

      const booking = {
        type: 'traslado',
        vehicle: data.vehicle,
        vehicleName: data.vehicleName,
        distance: data.distance,
        passengers: data.passengers,
        price: data.price,
        pickup: data.pickup,
        pickupLat: data.pickupLat,
        pickupLng: data.pickupLng,
        destination: data.destination,
        destinationLat: data.destinationLat,
        destinationLng: data.destinationLng,
      };

      localStorage.setItem('jacBookingDraft', JSON.stringify(booking));
      window.location.href = '../checkout.html?prefill=1&type=traslado';
    });
  </script>
</body>
</html>
