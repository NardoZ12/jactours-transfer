<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada | Jac Tours & Transfer</title>
  <meta name="description" content="La página que buscas no existe. Vuelve al inicio para explorar nuestras experiencias y servicios de turismo." />
  <link rel="icon" href="./assets/favicon-jac.svg" type="image/svg+xml" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f4efec 0%, #ddb7ab 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #999b85;
    }

    .container {
      max-width: 600px;
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      padding: 60px 40px;
      box-shadow: 0 20px 40px rgba(10, 43, 84, 0.08);
      border: 1px solid rgba(221, 183, 171, 0.3);
    }

    .error-code {
      font-size: 120px;
      font-weight: 800;
      background: linear-gradient(135deg, #ddb7ab 0%, #999b85 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0 0 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 16px;
      color: #999b85;
    }

    p {
      font-size: 18px;
      color: #ddb7ab;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .suggestions {
      text-align: left;
      background: #f9f7f5;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 40px;
    }

    .suggestions h3 {
      color: #999b85;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .suggestions a {
      display: block;
      padding: 10px 0;
      color: #ddb7ab;
      text-decoration: none;
      border-bottom: 1px solid #e4d6cf;
      transition: color 0.3s;
    }

    .suggestions a:last-child {
      border-bottom: none;
    }

    .suggestions a:hover {
      color: #999b85;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a.btn {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s;
      border: 2px solid;
    }

    a.btn-primary {
      background: #999b85;
      color: white;
      border-color: #999b85;
    }

    a.btn-primary:hover {
      background: transparent;
      color: #999b85;
    }

    a.btn-secondary {
      background: transparent;
      color: #999b85;
      border-color: #999b85;
    }

    a.btn-secondary:hover {
      background: #999b85;
      color: white;
    }

    .logo {
      height: 60px;
      margin-bottom: 30px;
      display: inline-block;
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 24px;
      }

      .error-code {
        font-size: 80px;
      }

      h1 {
        font-size: 24px;
      }

      p {
        font-size: 16px;
      }

      .buttons {
        flex-direction: column;
      }

      a.btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="./assets/logo-3.png" alt="Jac Tours" class="logo" />
    <div class="error-code">404</div>
    <h1>Página No Encontrada</h1>
    <p>La página que buscas no existe o ha sido movida a otra ubicación.</p>

    <div class="suggestions">
      <h3>¿Qué buscabas?</h3>
      <a href="/">Inicio</a>
      <a href="/servicios/excursiones">Excursiones</a>
      <a href="/servicios/yates">Yates y Embarcaciones</a>
      <a href="/servicios/traslados">Traslados</a>
      <a href="/politicas-y-consejos">Política y Consejos</a>
    </div>

    <div class="buttons">
      <a href="/" class="btn btn-primary">Volver al Inicio</a>
      <a href="javascript:history.back();" class="btn btn-secondary">Volver Atrás</a>
    </div>
  </div>
</body>
</html>
