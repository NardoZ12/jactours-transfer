<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAC Tours & Transfer | Reserva tu Experiencia</title>
    <meta name="description" content="Elige tu experiencia: Excursiones y tours o Transporte y traslados en República Dominicana.">
    <link rel="icon" href="assets/logo-3.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        body {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(-45deg, #0a4a6e, #1a6b8f, #2a7fa8, #1a5d7e, #0a4a6e);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animated bubbles/particles effect */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0));
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
            opacity: 0.6;
        }

        .bubble:nth-child(1) {
            width: 100px;
            height: 100px;
            top: 10%;
            left: 10%;
            animation-duration: 15s;
            animation-delay: 0s;
        }

        .bubble:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 60%;
            right: 10%;
            animation-duration: 20s;
            animation-delay: 2s;
        }

        .bubble:nth-child(3) {
            width: 80px;
            height: 80px;
            top: 30%;
            right: 30%;
            animation-duration: 18s;
            animation-delay: 4s;
        }

        .bubble:nth-child(4) {
            width: 120px;
            height: 120px;
            bottom: 10%;
            left: 20%;
            animation-duration: 22s;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) translateX(0px);
            }
            25% {
                transform: translateY(-20px) translateX(15px);
            }
            50% {
                transform: translateY(-40px) translateX(-15px);
            }
            75% {
                transform: translateY(-20px) translateX(20px);
            }
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 40, 60, 0.3);
            z-index: -1;
        }

        .container {
            text-align: center;
            max-width: 550px;
            width: 100%;
            padding: 50px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.12);
            border-radius: 25px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.15);
            animation: slideUp 0.8s ease-out;
            margin: 20px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            height: 70px;
            margin-bottom: 30px;
            animation: fadeIn 0.6s ease-out 0.2s both;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .title {
            font-size: 40px;
            font-weight: 700;
            color: white;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
            animation: fadeIn 0.6s ease-out 0.4s both;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 50px;
            animation: fadeIn 0.6s ease-out 0.6s both;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .option-btn {
            padding: 26px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            animation: fadeIn 0.6s ease-out 0.8s both;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .option-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            transition: left 0.4s ease;
            z-index: 0;
        }

        .option-btn:hover::before {
            left: 100%;
        }

        .option-btn span {
            position: relative;
            z-index: 1;
        }

        .tours-btn {
            background: linear-gradient(135deg, #f27d2e 0%, #d96b25 100%);
            color: white;
            border-color: rgba(242, 125, 46, 0.5);
        }

        .tours-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(242, 125, 46, 0.4);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .transport-btn {
            background: linear-gradient(135deg, #3196e2 0%, #2175c3 100%);
            color: white;
            border-color: rgba(49, 150, 226, 0.5);
        }

        .transport-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(49, 150, 226, 0.4);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .option-btn:active {
            transform: translateY(-2px);
        }

        .label {
            display: block;
            font-size: 11px;
            opacity: 0.95;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 600;
        }

        .label-main {
            display: block;
            font-size: 21px;
            font-weight: 700;
        }

        .whatsapp-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 56px;
            height: 56px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
            animation: fadeIn 0.6s ease-out 1s both;
            z-index: 10;
            border: none;
        }

        .whatsapp-btn:hover {
            transform: scale(1.12);
            box-shadow: 0 8px 28px rgba(37, 211, 102, 0.5);
        }

        .whatsapp-btn svg {
            width: 26px;
            height: 26px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 25px;
            }

            .title {
                font-size: 32px;
            }

            .subtitle {
                font-size: 14px;
                margin-bottom: 40px;
            }

            .option-btn {
                padding: 22px;
                font-size: 16px;
            }

            .logo {
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>
    <div class="overlay"></div>

    <div class="container">
        <img src="assets/logo-3.png" alt="JAC Tours" class="logo">
        
        <h1 class="title">¿Qué quieres reservar?</h1>
        <p class="subtitle">Elige tu experiencia perfecta</p>

        <div class="options">
            <a href="/servicios/excursiones" class="option-btn tours-btn">
                <span class="label">Aventura & Experiencias</span>
                <span class="label-main">EXCURSIONES Y TOURS</span>
            </a>

            <a href="/traslados" class="option-btn transport-btn">
                <span class="label">Viaje Cómodo</span>
                <span class="label-main">TRANSPORTE Y TRASLADOS</span>
            </a>
        </div>
    </div>

    <a href="https://wa.me/1234567890" class="whatsapp-btn" target="_blank" rel="noopener">

</body>
</html>
