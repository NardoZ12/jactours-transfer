<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAC Tours & Transfer | Reserva tu Experiencia</title>
    <meta name="description" content="Elige tu experiencia: Excursiones y tours o Transporte y traslados en República Dominicana.">
    <link rel="icon" href="assets/logo-3.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            padding: 40px;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            height: 60px;
            margin-bottom: 30px;
            animation: fadeIn 0.6s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .title {
            font-size: 36px;
            font-weight: 700;
            color: white;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
            animation: fadeIn 0.6s ease-out 0.4s both;
        }

        .subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 50px;
            animation: fadeIn 0.6s ease-out 0.6s both;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .option-btn {
            padding: 24px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            animation: fadeIn 0.6s ease-out 0.8s both;
        }

        .option-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
            z-index: 0;
        }

        .option-btn:hover::before {
            left: 100%;
        }

        .option-btn span {
            position: relative;
            z-index: 1;
        }

        .tours-btn {
            background: linear-gradient(135deg, #f27d2e 0%, #d96b25 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(242, 125, 46, 0.3);
        }

        .tours-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(242, 125, 46, 0.4);
        }

        .transport-btn {
            background: linear-gradient(135deg, #3196e2 0%, #2175c3 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(49, 150, 226, 0.3);
        }

        .transport-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(49, 150, 226, 0.4);
        }

        .option-btn:active {
            transform: translateY(-1px);
        }

        .label {
            display: block;
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
            font-weight: 500;
        }

        .label-main {
            display: block;
            font-size: 20px;
            font-weight: 700;
        }

        .whatsapp-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
            animation: fadeIn 0.6s ease-out 1s both;
        }

        .whatsapp-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
        }

        .whatsapp-btn svg {
            width: 24px;
            height: 24px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .title {
                font-size: 28px;
            }

            .subtitle {
                font-size: 14px;
                margin-bottom: 40px;
            }

            .option-btn {
                padding: 20px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="assets/logo-3.png" alt="JAC Tours" class="logo">
        
        <h1 class="title">¿Qué quieres reservar?</h1>
        <p class="subtitle">Elige tu experiencia perfecta</p>

        <div class="options">
            <a href="/tours" class="option-btn tours-btn">
                <span class="label">Aventura & Experiencias</span>
                <span class="label-main">EXCURSIONES Y TOURS</span>
            </a>

            <a href="/traslados" class="option-btn transport-btn">
                <span class="label">Viaje Cómodo</span>
                <span class="label-main">TRANSPORTE Y TRASLADOS</span>
            </a>
        </div>
    </div>

    <a href="https://wa.me/1234567890" class="whatsapp-btn" target="_blank" rel="noopener">

</body>
</html>
