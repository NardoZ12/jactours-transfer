<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productos y Tarifas | Jac Tours & Transfer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="wrap">
    <section class="card" style="padding: 18px;">
      <header class="topbar card" style="margin-bottom: 20px;">
        <div>
          <h1>Productos y Tarifas</h1>
          <p class="muted">Gestión centralizada de experiencias, precios y disponibilidad</p>
        </div>
        <div class="topbar-actions">
          <button id="addProductBtn" class="btn-light">+ Agregar Producto</button>
          <button id="backBtn" class="btn-light">Volver</button>
        </div>
      </header>

      <!-- Filtros -->
      <div class="form-grid compact" style="margin-bottom: 20px;">
        <label>
          Búsqueda
          <input id="productFilter" type="text" placeholder="Buscar por nombre o categoría..." />
        </label>
        <label>
          Categoría
          <select id="categoryFilter">
            <option value="">Todas las categorías</option>
            <option value="excursion">Excursión</option>
            <option value="yate">Yate</option>
            <option value="traslado">Traslado</option>
            <option value="otro">Otro</option>
          </select>
        </label>
      </div>

      <!-- Tabla de Productos -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Precio Base</th>
              <th>Precio Oferta</th>
              <th>Oferta</th>
              <th>Activo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="productsBody">
            <tr><td colspan="7">Cargando productos...</td></tr>
          </tbody>
        </table>
      </div>
      <p id="productsMsg" class="msg"></p>

      <!-- Modal Agregar/Editar Producto -->
      <div id="productModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
        <div class="card" style="width:min(500px,90vw);padding:24px;">
          <h3>Producto</h3>
          <form id="productForm" class="form-grid">
            <label>
              Nombre
              <input id="productName" type="text" required />
            </label>
            <label>
              Categoría
              <select id="productCategory" required>
                <option value="">Selecciona categoría</option>
                <option value="excursion">Excursión</option>
                <option value="yate">Yate</option>
                <option value="traslado">Traslado</option>
              </select>
            </label>
            <label>
              Slug (URL)
              <input id="productSlug" type="text" placeholder="isla-saona-clasica" />
            </label>
            <label>
              Precio Base (USD)
              <input id="productBasePrice" type="number" min="0" step="0.01" required />
            </label>
            <label>
              Precio Oferta (USD)
              <input id="productOfferPrice" type="number" min="0" step="0.01" placeholder="Dejar vacío para sin oferta" />
            </label>
            <label>
              Etiqueta de Oferta
              <input id="productOfferLabel" type="text" placeholder="Ej. Oferta Web" maxlength="80" />
            </label>
            <label class="offer-toggle">
              <input id="productOfferActive" type="checkbox" />
              <span>Publicar oferta</span>
            </label>
            <label class="offer-toggle">
              <input id="productActive" type="checkbox" checked />
              <span>Producto activo</span>
            </label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <button type="submit">Guardar</button>
              <button type="button" id="closeModalBtn" class="btn-light">Cancelar</button>
            </div>
          </form>
          <p id="productFormMsg" class="msg"></p>
        </div>
      </div>

      <p><a href="./index.html">Volver al dashboard</a></p>
    </section>
  </main>
  <script type="module" src="./productos-tarifas.js"></script>
</body>
</html>
